name: Create version tag

on:
  push:
    branches:
      - main
    paths:
      - Cargo.toml

permissions:
  actions: write
  contents: write

concurrency:
  group: create-version-tag
  cancel-in-progress: false

jobs:
  tag:
    name: Tag Cargo package version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect version change
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail

          read_package_version() {
            awk '
              /^\[package\][[:space:]]*$/ { in_package = 1; next }
              /^\[/ { in_package = 0 }
              in_package && /^[[:space:]]*version[[:space:]]*=/ {
                value = $0
                sub(/^[^=]*=[[:space:]]*/, "", value)
                sub(/[[:space:]]*#.*/, "", value)
                gsub(/^"|"$/, "", value)
                print value
                exit
              }
            '
          }

          if [[ "${BEFORE_SHA}" =~ ^0+$ ]]; then
            echo "The main branch has no previous commit; skipping version tag creation."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          current_version="$(read_package_version < Cargo.toml)"
          previous_version="$(git show "${BEFORE_SHA}:Cargo.toml" | read_package_version)"

          if [[ -z "${current_version}" || -z "${previous_version}" ]]; then
            echo "Could not read package versions from Cargo.toml" >&2
            exit 1
          fi

          tag="v${current_version}"
          git check-ref-format "refs/tags/${tag}"

          if [[ "${current_version}" == "${previous_version}" ]]; then
            echo "Cargo.toml changed, but the package version is still ${current_version}."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "Package version changed from ${previous_version} to ${current_version}."
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Create and push tag
        if: steps.version.outputs.changed == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          existing_target="$(git rev-list -n 1 "${TAG}" 2>/dev/null || true)"
          if [[ -n "${existing_target}" ]]; then
            if [[ "${existing_target}" != "${GITHUB_SHA}" ]]; then
              echo "Tag ${TAG} already points to ${existing_target}, not ${GITHUB_SHA}." >&2
              exit 1
            fi
            echo "Tag ${TAG} already points to this commit; nothing to push."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "${TAG}" --message "Release ${TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${TAG}"

      # Tag pushes made with GITHUB_TOKEN do not start another workflow, so
      # explicitly dispatch the existing build/publish/release workflow.
      - name: Build and release tag
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh workflow run CI.yml --ref "${TAG}"
