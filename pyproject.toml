[build-system]
requires = ["maturin>=1,<2"]
build-backend = "maturin"

[project]
name = "pykk"
# The version is the single source of truth in Cargo.toml
dynamic = ["version"]
description = "Fast Kramers-Kronig transform library written in Rust"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = ["numpy>=1.21"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

[dependency-groups]
dev = [
    "maturin>=1.7.0",
    "pytest>=9.1.1",
    "ziglang>=0.13.0",
]
